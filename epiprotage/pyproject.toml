[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "EpiProtAge"
dynamic = ["version"]
description = "Zero-shot clock of brain proteome aging from transcript-feature (m6A, Orthrus, RiboNN) predicted age effects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "shuyang-zhao" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.23", "scipy>=1.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/shuyang-zhao/m6A_aging_brain"

[project.scripts]
epiprotage = "epiprotage.cli:main"

[tool.hatch.version]
path = "src/epiprotage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/epiprotage"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "build_weights.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
